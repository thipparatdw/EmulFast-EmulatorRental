# EmulFast — Reverse Proxy
#
# Routes:
#   /api/*        → api:4000   (NestJS REST + Stripe webhook)
#   /socket.io/*  → api:4000   (Socket.IO emulator status)
#   /ws/scrcpy/*  → ws-scrcpy:8000
#   /*            → web:3000   (Next.js)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream api_backend {
    server api:4000;
    keepalive 32;
}

upstream web_backend {
    server web:3000;
    keepalive 16;
}

upstream scrcpy_backend {
    server ws-scrcpy:8000;
    keepalive 32;
}

# ─── HTTP ───────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # REST API + Stripe webhook
    location /api/ {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 30s;
    }

    # Socket.IO (NestJS emulator gateway, namespace /ws/emulator)
    location /socket.io/ {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # ws-scrcpy H.264 stream
    location /ws/scrcpy/ {
        proxy_pass            http://scrcpy_backend;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade    $http_upgrade;
        proxy_set_header      Connection $connection_upgrade;
        proxy_set_header      Host       $host;
        proxy_set_header      X-Real-IP  $remote_addr;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
        proxy_buffering       off;
        proxy_request_buffering off;
        proxy_buffer_size     64k;
    }

    # Next.js (catch-all)
    location / {
        proxy_pass         http://web_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}

# ─── HTTPS (เปิดใช้เมื่อมี domain + cert) ───────────────────────────────────
# ขั้นตอน:
#   1. ชี้ DNS domain → IP server นี้
#   2. sudo apt install certbot python3-certbot-nginx
#   3. sudo certbot --nginx -d yourdomain.com
#   certbot จะ auto-edit ไฟล์นี้และ reload nginx
#
# หรือ manual:
# server {
#     listen 443 ssl http2;
#     server_name yourdomain.com;
#     ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ... (copy location blocks จาก HTTP server ด้านบน)
# }
# server {
#     listen 80;
#     server_name yourdomain.com;
#     return 301 https://$host$request_uri;
# }
