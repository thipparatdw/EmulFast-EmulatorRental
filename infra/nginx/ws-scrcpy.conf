# ws-scrcpy WebSocket Proxy
# Proxies /ws/scrcpy/ → ws-scrcpy:8000
# Include at http {} level, e.g.:
#   include /etc/nginx/conf.d/ws-scrcpy.conf;

# Upstream สำหรับ ws-scrcpy service (Docker service name)
upstream ws_scrcpy_backend {
    server ws-scrcpy:8000;
    keepalive 32;
}

# Map ค่า Connection header เพื่อ support WebSocket upgrade
# หาก upstream ส่ง upgrade กลับมา ให้ forward ต่อ, มิเช่นนั้น close
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # แทนด้วย domain จริง หรือ _ เพื่อ catch-all
    server_name _;

    # -------------------------------------------------------
    # WebSocket proxy: /ws/scrcpy/<emulatorId>
    # Client connect มาที่ ws://domain/ws/scrcpy/emu-123
    # Nginx forward ไป ws://ws-scrcpy:8000/ws/scrcpy/emu-123
    # -------------------------------------------------------
    location /ws/scrcpy/ {
        proxy_pass http://ws_scrcpy_backend;

        # WebSocket upgrade headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forward headers ปกติ
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout สำหรับ long-lived WebSocket connection (stream ต่อเนื่อง)
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;

        # ปิด buffering — WS/streaming ต้องการ real-time
        proxy_buffering off;
        proxy_request_buffering off;

        # ขนาด buffer สำหรับ H.264 frame chunks
        proxy_buffer_size 64k;
    }
}
